version: 2
updates:
  # "npm" covers pnpm too — Dependabot detects pnpm-lock.yaml and updates it
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    groups:
      # One PR for all minor/patch dev-dependency bumps instead of one per package
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      # Same for runtime dependencies; majors still get their own PRs
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
